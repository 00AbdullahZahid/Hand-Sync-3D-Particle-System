<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>"
    />
    <title>Hand-Sync Particle Nexus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --glass: rgba(9, 18, 29, 0.68);
        --glass-heavy: rgba(17, 31, 47, 0.9);
        --border: rgba(176, 226, 239, 0.22);
        --accent: #8df4ff;
        --freeze: #ff4d4d;
        --morph: #a855f7;
        --ink-soft: rgba(226, 241, 244, 0.62);
      }

      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 72% 46%, rgba(0, 196, 213, 0.12), transparent 32%),
          radial-gradient(circle at 20% 80%, rgba(119, 56, 190, 0.12), transparent 28%),
          #04080d;
        font-family: "Space Grotesk", sans-serif;
        color: white;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      body::before {
        position: fixed;
        inset: 0;
        background-image: linear-gradient(rgba(141, 244, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(141, 244, 255, 0.035) 1px, transparent 1px);
        background-size: 64px 64px;
        content: "";
        mask-image: linear-gradient(to bottom, black, transparent 78%);
        pointer-events: none;
      }

      #info {
        position: absolute;
        top: 28px;
        left: 28px;
        width: min(380px, calc(100% - 56px));
        text-align: left;
        pointer-events: none;
        z-index: 10;
        max-width: 90%;
        animation: rise-in 0.8s ease both;
      }


      #info h1 {
        font-weight: 700;
        margin: 0;
        margin-bottom: 18px;
        font-size: clamp(1.8rem, 5vw, 3.6rem);
        letter-spacing: 0;
        background: linear-gradient(110deg, #ffffff 15%, var(--accent) 92%);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-transform: uppercase;
        line-height: 1.2;
      }


      #info p {
        font-size: 0.72rem;
        margin: 0;
        letter-spacing: 0.08em;
        line-height: 2.2;
        text-transform: uppercase;
        font-weight: 500;
        color: var(--ink-soft);
      }

      #info b {
        color: #061015;
        background: var(--accent);
        padding: 3px 7px;
        border-radius: 3px;
        margin: 0 3px;
        font-size: 0.9em;
      }

      /* Shape display - responsive positioning */
      #shape-display {
        position: absolute;
        top: 28px;
        right: 28px;
        text-align: right;
        z-index: 10;
        pointer-events: none;
        max-width: 45%;
        animation: rise-in 0.8s 0.12s ease both;
      }

      #shape-label {
        font-size: clamp(0.5rem, 2vw, 0.7rem);
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--ink-soft);
        margin-bottom: 6px;
        font-family: "DM Mono", monospace;
      }

      #current-shape-name {
        font-size: clamp(1rem, 4vw, 1.5rem);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--accent);
        text-shadow: 0 0 24px rgba(141, 244, 255, 0.42);
        line-height: 1.2;
        word-break: break-word;
      }
  #credit {
        position: absolute;
        bottom: 28px;
        left: 28px;
        text-align: left;
        z-index: 10;
        pointer-events: none;
        font-size: 0.62rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: rgba(255, 255, 255, 0.5);
        background: var(--glass);
        padding: 8px 11px;
        border-radius: 4px;
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.3s ease;
      }

      #credit:hover {
        color: var(--accent);
        border-color: rgba(0, 242, 255, 0.3);
        background: rgba(0, 242, 255, 0.05);
      }

      #status {
        position: absolute;
        right: 28px;
        bottom: 28px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink-soft);
        font: 500 0.62rem "DM Mono", monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        pointer-events: none;
      }

      #status::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ffbf69;
        box-shadow: 0 0 12px #ffbf69;
        content: "";
      }

      #shape-cycle {
        margin-top: 10px;
        padding: 7px 10px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--glass);
        color: var(--ink-soft);
        font: 500 0.58rem "DM Mono", monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        pointer-events: auto;
        transition: 0.2s ease;
      }

      #shape-cycle:hover,
      #shape-cycle:focus-visible {
        border-color: var(--accent);
        color: var(--accent);
        outline: none;
      }

      @keyframes rise-in {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }


      #webcam-feed {
        display: block;
        position: absolute;
        bottom: 15px;
        right: 15px;
        width: clamp(120px, 30vw, 240px);
        height: auto;
        border-radius: 8px;
        border: 2px solid rgba(255, 255, 255, 0.5);
        transform: scaleX(-1);
        z-index: 5;
        background: #222;
        transition: all 0.3s ease;
      }


      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: var(--accent);
        letter-spacing: 1px;
        font-size: clamp(0.7rem, 3vw, 0.9rem);
        text-transform: uppercase;
        text-align: center;
        padding: 0 20px;
        width: 80%;
      }


      @media (max-width: 768px) {
        #info {
          top: 18px;
          left: 18px;
          width: min(320px, calc(100% - 36px));
        }

        #shape-display {
          top: 18px;
          right: 18px;
        }

        #webcam-feed {
          bottom: 10px;
          right: 10px;
          width: clamp(100px, 25vw, 180px);
        }

        #info p {
          line-height: 1.6;
        }
      }

      @media (max-width: 480px) {
        #info {
          top: 14px;
          left: 14px;
          width: calc(100% - 28px);
        }

        #shape-display {
          top: 14px;
          right: 14px;
        }

        #webcam-feed {
          bottom: 8px;
          right: 8px;
          width: clamp(90px, 22vw, 150px);
          border-radius: 6px;
        }

        #info h1 {
          margin-bottom: 10px;
        }

        #info p {
          letter-spacing: 0.8px;
        }

        #status {
          right: 14px;
          bottom: 14px;
        }

        #credit {
          bottom: 14px;
          left: 14px;
        }
      }

  
      @media (max-width: 320px) {
        #info p {
          font-size: 0.5rem;
          line-height: 1.4;
        }

        #shape-label {
          font-size: 0.45rem;
        }

        #current-shape-name {
          font-size: 0.9rem;
        }
      }

      
      @media (max-height: 500px) and (orientation: landscape) {
        #info {
          top: 10px;
          left: 10px;
        }

        #info h1 {
          font-size: 1.2rem;
          margin-bottom: 8px;
        }

        #info p {
          font-size: 0.5rem;
          line-height: 1.3;
          margin-top: 5px;
        }

        #shape-display {
          top: 10px;
          right: 10px;
        }

        #webcam-feed {
          bottom: 5px;
          right: 5px;
          width: 100px;
        }

        #loading {
          font-size: 0.6rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="info">
      <h1>Nexus Flow</h1>
      <p>
        👋 MOVE TO <span style="opacity: 0.6">ROTATE & COLOR</span><br />
        🤏 <b>PINCH</b> TO <span style="opacity: 0.6">MORPH SHAPE</span><br />
        ✊ <b>FIST</b> TO <span style="opacity: 0.6">EXPAND RADIUS</span><br />
        ☝️ <b>1 FINGER</b> TO <span style="opacity: 0.6">FREEZE MESH</span>
      </p>
    </div>

    <div id="shape-display">
      <div id="shape-label">Active Formation</div>
      <div id="current-shape-name">Sphere</div>
      <button id="shape-cycle" type="button">Next formation</button>
    </div>
    
  <div id="credit">Created by Abdullah Zahid</div>
  <div id="status" aria-live="polite">Awaiting hand</div>
    
    <div id="loading">Initializing Neural Mesh...</div>
    <video id="webcam-feed" autoplay playsinline></video>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
      crossorigin="anonymous"
    ></script>

    <script>
    
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      const PARTICLE_COUNT = isMobile ? 10000 : 20000;

      let currentShape = "sphere";
      const shapeList = [
        "sphere",
        "heart",
        "saturn",
        "flower",
        "fireworks",
        "cube",
        "helix",
        "galaxy",
      ];
      let shapeIndex = 0;

      let targetPositions = [];
      let handX = 0,
        handY = 0;
      let isPinching = false;
      let isFist = false;
      let isFrozen = false;
      const statusElement = document.getElementById("status");
      const shapeCycleButton = document.getElementById("shape-cycle");

      let lastPinchTime = 0;

      // --- Scene Setup ---
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.z = 10;

      const renderer = new THREE.WebGLRenderer({
        antialias: !isMobile, // Disable antialias on mobile for performance
        alpha: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, isMobile ? 1 : 2)
      );
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      function createHardCircleTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext("2d");
        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, "rgba(255,255,255,1)");
        gradient.addColorStop(0.5, "rgba(255,255,255,0.9)");
        gradient.addColorStop(0.8, "rgba(255,255,255,0.1)");
        gradient.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(canvas);
      }

      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(PARTICLE_COUNT * 3);
      const colors = new Float32Array(PARTICLE_COUNT * 3);

      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        positions[i] = (Math.random() - 0.5) * 20;
        colors[i] = 1;
      }

      geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(positions, 3)
      );
      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: isMobile ? 0.15 : 0.12,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        map: createHardCircleTexture(),
      });

      const particles = new THREE.Points(geometry, material);
      scene.add(particles);

      // --- Shapes Math ---
      const shapes = {
        sphere: (i) => {
          const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
          const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
          return [
            4 * Math.cos(theta) * Math.sin(phi),
            4 * Math.sin(theta) * Math.sin(phi),
            4 * Math.cos(phi),
          ];
        },
        heart: (i) => {
          const phi = Math.random() * Math.PI * 2;
          const x = 16 * Math.pow(Math.sin(phi), 3);
          const y =
            13 * Math.cos(phi) -
            5 * Math.cos(2 * phi) -
            2 * Math.cos(3 * phi) -
            Math.cos(4 * phi);
          return [x * 0.25, y * 0.25, (Math.random() - 0.5) * 2];
        },
        saturn: (i) => {
          if (i < PARTICLE_COUNT * 0.6) {
            const phi = Math.acos(-1 + (2 * i) / (PARTICLE_COUNT * 0.6));
            const theta = Math.sqrt(PARTICLE_COUNT * 0.6 * Math.PI) * phi;
            return [
              2.5 * Math.cos(theta) * Math.sin(phi),
              2.5 * Math.sin(theta) * Math.sin(phi),
              2.5 * Math.cos(phi),
            ];
          } else {
            const angle = Math.random() * Math.PI * 2;
            const r = 4.5 + Math.random() * 2;
            return [
              r * Math.cos(angle),
              (Math.random() - 0.5) * 0.3,
              r * Math.sin(angle),
            ];
          }
        },
        flower: (i) => {
          const u = Math.random() * Math.PI * 2;
          const v = Math.random() * Math.PI;
          const r = 3 + Math.sin(5 * u) * Math.sin(5 * v);
          return [
            r * Math.sin(v) * Math.cos(u),
            r * Math.sin(v) * Math.sin(u),
            r * Math.cos(v),
          ];
        },
        fireworks: (i) => {
          const r = Math.pow(Math.random(), 1 / 3) * 7;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          return [
            r * Math.sin(phi) * Math.cos(theta),
            r * Math.sin(phi) * Math.sin(theta),
            r * Math.cos(phi),
          ];
        },
        cube: (i) => {
          const side = 4.8;
          const face = i % 6;
          const u = (Math.random() - 0.5) * side;
          const v = (Math.random() - 0.5) * side;
          const edge = side / 2;
          const faces = [
            [edge, u, v],
            [-edge, u, v],
            [u, edge, v],
            [u, -edge, v],
            [u, v, edge],
            [u, v, -edge],
          ];
          return faces[face];
        },
        helix: (i) => {
          const progress = i / PARTICLE_COUNT;
          const angle = progress * Math.PI * 14;
          const radius = 2.6 + Math.sin(progress * Math.PI * 6) * 0.35;
          return [
            Math.cos(angle) * radius,
            (progress - 0.5) * 8,
            Math.sin(angle) * radius,
          ];
        },
        galaxy: (i) => {
          const progress = Math.pow(Math.random(), 0.62);
          const arm = i % 5;
          const angle = arm * ((Math.PI * 2) / 5) + progress * 7.5;
          const radius = progress * 6.5;
          return [
            Math.cos(angle) * radius,
            (Math.random() - 0.5) * (0.35 + progress * 0.7),
            Math.sin(angle) * radius,
          ];
        },
      };

      function getTargetPositions(shapeName) {
        const arr = new Float32Array(PARTICLE_COUNT * 3);
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const [x, y, z] = shapes[shapeName](i);
          arr[i * 3] = x;
          arr[i * 3 + 1] = y;
          arr[i * 3 + 2] = z;
        }
        return arr;
      }

      targetPositions = getTargetPositions(currentShape);

      function formatShapeName(shapeName) {
        return shapeName.charAt(0).toUpperCase() + shapeName.slice(1);
      }

      function cycleShape(force = false) {
        const now = Date.now();
        if (!force && now - lastPinchTime < 4000) return;

        shapeIndex = (shapeIndex + 1) % shapeList.length;
        currentShape = shapeList[shapeIndex];

        document.getElementById("current-shape-name").innerText =
          formatShapeName(currentShape);

        targetPositions = getTargetPositions(currentShape);
        lastPinchTime = now;
      }

      shapeCycleButton.addEventListener("click", () => cycleShape(true));

      // --- Hand Tracking ---
      const videoElement = document.getElementById("webcam-feed");
      const hands = new Hands({
        locateFile: (file) =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: isMobile ? 0 : 1, // Lower complexity on mobile
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6,
      });

      hands.onResults((results) => {
        document.getElementById("loading").style.display = "none";
        if (
          results.multiHandLandmarks &&
          results.multiHandLandmarks.length > 0
        ) {
          const lm = results.multiHandLandmarks[0];
          handX = (1 - lm[8].x) * 2 - 1;
          handY = (1 - lm[8].y) * 2 - 1;

          const pinchDist = Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y);
          isPinching = pinchDist < 0.05;
          if (isPinching) cycleShape();

          const isIndexDown = lm[8].y > lm[6].y;
          const isMiddleDown = lm[12].y > lm[10].y;
          const isRingDown = lm[16].y > lm[14].y;
          const isPinkyDown = lm[20].y > lm[18].y;

          isFist = isIndexDown && isMiddleDown && isRingDown && isPinkyDown;
          isFrozen = !isIndexDown && isMiddleDown && isRingDown && isPinkyDown;

          if (isFrozen) {
            statusElement.textContent = "Mesh frozen";
            videoElement.style.borderColor = "var(--freeze)";
          } else if (isPinching) {
            statusElement.textContent = "Morphing formation";
            videoElement.style.borderColor = "var(--morph)";
          } else if (isFist) {
            statusElement.textContent = "Radius expanded";
            videoElement.style.borderColor = "var(--accent)";
            videoElement.style.boxShadow = "0 0 30px rgba(0, 242, 255, 0.6)";
          } else {
            statusElement.textContent = "Hand linked";
            videoElement.style.borderColor = "rgba(255, 255, 255, 0.5)";
            videoElement.style.boxShadow = "none";
          }
        } else {
          isPinching = false;
          isFist = false;
          isFrozen = false;
          statusElement.textContent = "Awaiting hand";
          videoElement.style.borderColor = "rgba(255, 255, 255, 0.5)";
          videoElement.style.boxShadow = "none";
        }
      });

      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: isMobile ? 480 : 720,
        height: isMobile ? 320 : 480,
      });
      cameraUtils.start();

      // --- Animation Loop ---
      const clock = new THREE.Clock();
      const colorObj = new THREE.Color();

      function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();
        const posAttr = particles.geometry.attributes.position;
        const colAttr = particles.geometry.attributes.color;

        if (!isFrozen) {
          particles.rotation.y += 0.003 + handX * 0.04;
          particles.rotation.x += handY * 0.02;

          const s = isFist ? 2.2 : 1.0;
          particles.scale.lerp(new THREE.Vector3(s, s, s), 0.1);

          for (let i = 0; i < PARTICLE_COUNT; i++) {
            const ix = i * 3;
            posAttr.array[ix] +=
              (targetPositions[ix] - posAttr.array[ix]) * 0.08;
            posAttr.array[ix + 1] +=
              (targetPositions[ix + 1] - posAttr.array[ix + 1]) * 0.08;
            posAttr.array[ix + 2] +=
              (targetPositions[ix + 2] - posAttr.array[ix + 2]) * 0.08;

            if (currentShape !== "fireworks") {
              posAttr.array[ix] += Math.sin(time * 0.5 + i) * 0.005;
              posAttr.array[ix + 1] += Math.cos(time * 0.5 + i) * 0.005;
            } else {
              posAttr.array[ix + 1] -= 0.02;
              if (posAttr.array[ix + 1] < -6) posAttr.array[ix + 1] = 6;
            }

            const dist = Math.hypot(posAttr.array[ix], posAttr.array[ix + 1]);
            const hue = ((handY + 1) * 0.5 + dist * 0.1) % 1;
            colorObj.setHSL(hue, 0.8, 0.6);
            colAttr.array[ix] = colorObj.r;
            colAttr.array[ix + 1] = colorObj.g;
            colAttr.array[ix + 2] = colorObj.b;
          }
          posAttr.needsUpdate = true;
          colAttr.needsUpdate = true;
        }

        renderer.render(scene, camera);
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

   
      document.addEventListener(
        "touchmove",
        function (e) {
          if (e.scale !== 1) e.preventDefault();
        },
        { passive: false }
      );

      animate();
    </script>
  </body>
</html>
